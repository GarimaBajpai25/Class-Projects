<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>Student Admission Form</h1>
            <p>Please fill in the details carefully</p>
        </div>


        <!-- ADMISSION FORM -->
        <form id="admissionForm">

            <!-- PERSONAL INFORMATION -->
            <h2>Personal Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                    >

                    <small id="firstNameError"></small>
                </div>


                <div class="form-group">
                    <label for="lastName">Last Name</label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                    >

                    <small id="lastNameError"></small>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >

                    <small id="emailError"></small>
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10 digit number"
                    >

                    <small id="phoneError"></small>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="dob">Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                    >

                    <small id="dobError"></small>
                </div>


                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <small id="genderError"></small>
                </div>

            </div>


            <!-- ADDRESS -->
            <h2>Address Information</h2>

            <div class="form-group">

                <label for="address">Address</label>

                <textarea
                    id="address"
                    placeholder="Enter your complete address"
                ></textarea>

                <small id="addressError"></small>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                    >

                    <small id="cityError"></small>
                </div>


                <div class="form-group">
                    <label for="state">State</label>

                    <select id="state">

                        <option value="">
                            Select State
                        </option>

                        <option value="Uttar Pradesh">
                            Uttar Pradesh
                        </option>

                        <option value="Delhi">
                            Delhi
                        </option>

                        <option value="Maharashtra">
                            Maharashtra
                        </option>

                        <option value="Rajasthan">
                            Rajasthan
                        </option>

                        <option value="Madhya Pradesh">
                            Madhya Pradesh
                        </option>

                        <option value="Bihar">
                            Bihar
                        </option>

                        <option value="Gujarat">
                            Gujarat
                        </option>

                    </select>

                    <small id="stateError"></small>
                </div>

            </div>


            <div class="form-group">

                <label for="pincode">PIN Code</label>

                <input
                    type="text"
                    id="pincode"
                    placeholder="Enter 6 digit PIN code"
                >

                <small id="pincodeError"></small>

            </div>


            <!-- ACADEMIC INFORMATION -->
            <h2>Academic Information</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course">

                        <option value="">
                            Select Course
                        </option>

                        <option value="B.Tech">
                            B.Tech
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                        <option value="B.Sc">
                            B.Sc
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="MBA">
                            MBA
                        </option>

                    </select>

                    <small id="courseError"></small>

                </div>


                <div class="form-group">

                    <label for="branch">
                        Branch / Specialization
                    </label>

                    <select id="branch">

                        <option value="">
                            Select Branch
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Information Technology">
                            Information Technology
                        </option>

                        <option value="Artificial Intelligence">
                            Artificial Intelligence
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Mechanical">
                            Mechanical
                        </option>

                    </select>

                    <small id="branchError"></small>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="qualification">
                        Previous Qualification
                    </label>

                    <select id="qualification">

                        <option value="">
                            Select Qualification
                        </option>

                        <option value="10th">
                            10th
                        </option>

                        <option value="12th">
                            12th
                        </option>

                        <option value="Diploma">
                            Diploma
                        </option>

                        <option value="Graduation">
                            Graduation
                        </option>

                    </select>

                    <small id="qualificationError"></small>

                </div>


                <div class="form-group">

                    <label for="percentage">
                        Percentage
                    </label>

                    <input
                        type="number"
                        id="percentage"
                        min="0"
                        max="100"
                        step="0.01"
                        placeholder="Enter percentage"
                    >

                    <small id="percentageError"></small>

                </div>

            </div>


            <!-- PARENT INFORMATION -->
            <h2>Parent / Guardian Information</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="parentName">
                        Parent / Guardian Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        placeholder="Enter parent name"
                    >

                    <small id="parentNameError"></small>

                </div>


                <div class="form-group">

                    <label for="parentPhone">
                        Parent Phone Number
                    </label>

                    <input
                        type="tel"
                        id="parentPhone"
                        placeholder="Enter phone number"
                    >

                    <small id="parentPhoneError"></small>

                </div>

            </div>


            <!-- DOCUMENTS -->
            <h2>Documents</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="studentPhoto">
                        Student Photo
                    </label>

                    <input
                        type="file"
                        id="studentPhoto"
                        accept="image/*"
                    >

                    <small id="photoError"></small>

                </div>


                <div class="form-group">

                    <label for="marksheet">
                        Previous Marksheet
                    </label>

                    <input
                        type="file"
                        id="marksheet"
                        accept=".pdf,.jpg,.jpeg,.png"
                    >

                    <small id="marksheetError"></small>

                </div>

            </div>


            <!-- TERMS -->
            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    I agree that the information provided above
                    is correct.

                </label>

                <small id="termsError"></small>

            </div>


            <!-- BUTTONS -->
            <div class="button-group">

                <button
                    type="reset"
                    class="reset-button"
                >
                    Reset
                </button>

                <button
                    type="submit"
                    class="submit-button"
                >
                    Submit Admission
                </button>

            </div>

        </form>


        <!-- SUBMITTED STUDENTS -->
        <section class="students-section">

            <h2>Submitted Students</h2>

            <div id="studentContainer"></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
