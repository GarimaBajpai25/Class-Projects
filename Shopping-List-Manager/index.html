```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping List Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🛒 Shopping List Manager</h1>
        <p class="subtitle">Manage your shopping list easily</p>

        <!-- Add Item Section -->
        <div class="input-section">

            <input
                type="text"
                id="itemInput"
                placeholder="Enter shopping item..."
            >

            <input
                type="number"
                id="quantityInput"
                placeholder="Qty"
                min="1"
                value="1"
            >

            <button id="addBtn">Add Item</button>

        </div>

        <!-- Search Section -->
        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search items..."
            >

        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-box">
                <h3 id="totalItems">0</h3>
                <p>Total</p>
            </div>

            <div class="stat-box">
                <h3 id="purchasedItems">0</h3>
                <p>Purchased</p>
            </div>

            <div class="stat-box">
                <h3 id="remainingItems">0</h3>
                <p>Remaining</p>
            </div>

        </div>

        <!-- Shopping List -->
        <ul id="shoppingList"></ul>

        <!-- Empty Message -->
        <p id="emptyMessage">Your shopping list is empty.</p>

        <!-- Clear Button -->
        <button id="clearBtn" class="clear-btn">
            Clear All
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
```
